<h1>每日百科 · 归档</h1><p class="sub">共 2 期</p>
<ul><li><a href="p/2026-08-27.html"><span class="d">2026-08-27</span><span class="c">科学与技术史</span><span class="t">海底电缆先失败了三次</span></a><p>19世纪中叶多次铺设跨大西洋电报电缆均告失败。怀特豪斯用高电压强推信号，反而击穿绝缘层；开尔文指出电容效应才是信号衰减的主因，改用低电压配高灵敏度检流计后，1866年电缆终于持久工作。</p></li>
<li><a href="p/2026-08-26.html"><span class="d">2026-08-26</span><span class="c">自然地理</span><span class="t">卡帕多细亚的石头烟囱</span></a><p>安纳托利亚中部的卡帕多细亚由火山凝灰岩构成，软岩被侵蚀而玄武岩帽岩残留，形成锥柱地貌，当地人又把易凿的凝灰岩挖成地下城。</p></li></ul></div></body></html>
